name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docker:
    name: docker build + selftest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          docker --version
          python3 --version

      # 验收条件 0：启动命令红线（R5 两轮实测都栽在这里，做成硬门禁）。
      - name: 启动命令红线自检
        run: sh tools/check-startup-command.sh

      # 验收条件 1：Docker 构建必须通过。失败就在这里红。
      - name: Docker build
        run: docker build -t bunny-loader-server:ci ./server

      # 验收条件 5：C# 必须真的编译并跑起来。--selftest 会逐字节比对 golden vectors。
      - name: C# selftest (golden vectors)
        run: docker run --rm bunny-loader-server:ci --selftest

      # .plr 解析器：造一份 v319 合成存档（加密→落盘→按真实路径解析）验证 AES 与字段偏移。
      - name: .plr parser selftest (synthetic v319)
        run: docker run --rm bunny-loader-server:ci --plr-selftest

      - name: Python reference selftest
        run: python3 tools/proto_ref.py selftest

      # 端到端：起真实容器，用假 BL 客户端走一遍 1→3→68→200→6→7。
      - name: Start server
        run: |
          docker run -d --name bls --restart=no -p 17777:7777 -e WORLD_ON_HELLO=off -e PROOF_MODE=off \
            bunny-loader-server:ci --config config/server.json --capture captures

          ready=0
          for i in $(seq 1 30); do
            if docker logs bls 2>&1 | grep -q '"ev":"server.start"'; then
              echo "app reported server.start after ${i}s"
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "app never reported server.start"
            docker logs bls || true
            exit 1
          fi
          docker logs bls || true

      - name: Handshake end-to-end (fake BL client)
        run: python3 tools/fake_client.py 127.0.0.1 17777 flags1

      - name: Server logs
        if: always()
        run: |
          docker ps -a --format 'NAME={{.Names}} STATUS={{.Status}}'
          docker logs bls || true

      - name: Stop server
        if: always()
        run: docker rm -f bls

  panel:
    name: panel package (framework-dependent)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 面板自带 .NET 8，所以做标准框架依赖发布：只有 dll + runtimeconfig，约 200 KB。
      - name: Publish (framework-dependent)
        run: |
          rm -rf server/dist && mkdir -p server/dist
          docker run --rm -v "$PWD/server:/src" -w /src mcr.microsoft.com/dotnet/sdk:8.0 \
            dotnet publish src/BunnyLoader.Server/BunnyLoader.Server.csproj \
              -c Release -o /src/dist
          ls -lh server/dist

      - name: Print effective config (--port wins over everything)
        run: |
          docker run --rm -v "$PWD/server/dist:/app" -w /app \
            -e SKIP_WELCOME_PACK=true -e MSG3_HEX=0100 \
            mcr.microsoft.com/dotnet/runtime:8.0 \
            dotnet BunnyLoader.Server.dll --port 18080 --print-config

      # 模拟面板：runtime 镜像里没有 SDK，只有运行时；启动方式与面板一致。
      - name: Variant flags+bool1
        run: |
          docker run -d --name panel-v1 --restart=no -e MSG3_VARIANT=flags1 -e WORLD_ON_HELLO=off -e PROOF_MODE=off \
            -p 17780:7777 -v "$PWD/server/dist:/app" -w /app \
            mcr.microsoft.com/dotnet/runtime:8.0 \
            dotnet BunnyLoader.Server.dll --port 7777
          for i in $(seq 1 30); do
            docker logs panel-v1 2>&1 | grep -q '"ev":"server.start"' && break; sleep 1
          done
          docker logs panel-v1 || true
          python3 tools/fake_client.py 127.0.0.1 17780 flags1
          docker rm -f panel-v1

      - name: Variant slot (1 byte)
        run: |
          docker run -d --name panel-v2 --restart=no -e MSG3_VARIANT=slot -e WORLD_ON_HELLO=off -e PROOF_MODE=off \
            -p 17781:7777 -v "$PWD/server/dist:/app" -w /app \
            mcr.microsoft.com/dotnet/runtime:8.0 \
            dotnet BunnyLoader.Server.dll --port 7777
          for i in $(seq 1 30); do
            docker logs panel-v2 2>&1 | grep -q '"ev":"server.start"' && break; sleep 1
          done
          python3 tools/fake_client.py 127.0.0.1 17781 slot
          docker rm -f panel-v2

      - name: Variant flags+bool0
        run: |
          docker run -d --name panel-v3 --restart=no -e MSG3_VARIANT=flags0 -e WORLD_ON_HELLO=off -e PROOF_MODE=off \
            -p 17782:7777 -v "$PWD/server/dist:/app" -w /app \
            mcr.microsoft.com/dotnet/runtime:8.0 \
            dotnet BunnyLoader.Server.dll --port 7777
          for i in $(seq 1 30); do
            docker logs panel-v3 2>&1 | grep -q '"ev":"server.start"' && break; sleep 1
          done
          python3 tools/fake_client.py 127.0.0.1 17782 flags0
          docker rm -f panel-v3

      # 发布产物上的 .plr 解析自检（合成 v319 + debug/ 下的真实样本，若有）
      - name: .plr parser selftest (published dll)
        run: |
          mkdir -p debug
          docker run --rm -v "$PWD/server/dist:/app" -v "$PWD/debug:/app/debug" -w /app \
            mcr.microsoft.com/dotnet/runtime:8.0 \
            dotnet BunnyLoader.Server.dll --plr-selftest

      - name: 严格状态机 — 26 字节证明 + 回执 + 163 + 进世界
        run: |
          docker run -d --name panel-doc --restart=no \
            -e PROOF_MODE=on -e MSG3_VARIANT=flags1 \
            -p 17790:7777 -v "$PWD/server/dist:/app" -v "$PWD/debug:/app/debug" -w /app \
            mcr.microsoft.com/dotnet/runtime:8.0 \
            dotnet BunnyLoader.Server.dll --port 7777
          for i in $(seq 1 30); do
            docker logs panel-doc 2>&1 | grep -q '"ev":"server.start"' && break; sleep 1
          done
          python3 tools/fake_client.py 127.0.0.1 17790 proofdoc
          docker logs panel-doc | grep -E 'proof\.(sent|verified)|serverinfo\.163' | head -3

          # 诊断轮门禁：完整 40 字节必须真的被打出来（不允许再被截断成 24 字节）。
          docker logs panel-doc | grep -q '"ev":"syncplayer.raw"' \
            || { echo "缺少 syncplayer.raw（完整 40 字节 hex）"; docker logs panel-doc | tail -40; exit 1; }
          docker logs panel-doc | grep '"ev":"syncplayer.raw"' | head -1
          docker logs panel-doc | grep -q '"ev":"syncplayer.fields"' \
            || { echo "缺少 syncplayer.fields（固定偏移逐字段）"; exit 1; }
          docker logs panel-doc | grep '"ev":"syncplayer.fields"' | head -1

          # 7 个颜色必须逐条打出来（每色一行，带 hex）
          c_color=$(docker logs panel-doc | grep -c '"ev":"syncplayer.color"')
          echo "syncplayer.color 行数 = $c_color"
          [ "$c_color" -ge 7 ] || { echo "颜色行只有 $c_color 条，应 ≥7"; exit 1; }

          # 硬闸门：任何一次 id:4 发送都必须是 40 字节 payload（整帧 43 = 2+1+40）
          bad4=$(docker logs panel-doc | grep '"ev":"frame.send"' | grep '"name":"SyncPlayer"' | grep -vc '"payloadLen":40' || true)
          echo "非 40 字节的 id:4 发送次数 = $bad4"
          [ "$bad4" -eq 0 ] || { echo "存在非 40 字节的 id:4"; docker logs panel-doc | grep '"name":"SyncPlayer"'; exit 1; }

          # SSC：.plr 必须被加载，生命/魔力/背包必须真的下发
          docker logs panel-doc | grep -q '"ev":"ssc.store.ready"' \
            || { echo "缺少 ssc.store.ready（档案仓库没起来）"; exit 1; }
          docker logs panel-doc | grep '"ev":"ssc.store.ready"' | head -1
          docker logs panel-doc | grep '"ev":"ssc.sent"' | head -1

          ssc5=$(docker logs panel-doc | grep '"ev":"frame.send"' | grep -c '"id":"5"' || true)
          echo "id:5（槽位）下发帧数 = $ssc5"
          [ "$ssc5" -ge 97 ] || { echo "id:5 只有 $ssc5 帧，应 ≥97"; exit 1; }
          if docker logs panel-doc | grep -q '"ev":"player.equip.echoed"'; then
            echo "客户端 id:5 被错误回显"; docker logs panel-doc | grep 'player.equip.echoed'; exit 1
          fi

          for m in 16 42; do
            n=$(docker logs panel-doc | grep '"ev":"frame.send"' | grep -c "\"id\":\"$m\"" || true)
            echo "id:$m 下发帧数 = $n"
            [ "$n" -ge 1 ] || { echo "缺少 id:$m 下发"; exit 1; }
          done

          # R7.1 长度红线：16/42 必须 5 字节、5/12 必须 9 字节、4 必须 40 字节
          for pair in "4:40" "16:5" "42:5" "5:9" "12:9"; do
            mid=${pair%%:*}; want=${pair##*:}
            bad=$(docker logs panel-doc | grep '"ev":"frame.send"' | grep "\"id\":\"$mid\"" | grep -vc "\"payloadLen\":$want" || true)
            echo "id:$mid 非 $want 字节发送次数 = $bad"
            [ "$bad" -eq 0 ] || { echo "id:$mid 存在非 $want 字节的发送"; docker logs panel-doc | grep "\"id\":\"$mid\""; exit 1; }
          done

          # R6：SSC 不在 id:6 tail；在 id:8 后的覆盖队列中发送
          docker logs panel-doc | grep -q '"ev":"ssc.coverage.started"' \
            || { echo "缺少 ssc.coverage.started"; exit 1; }
          docker logs panel-doc | grep -q '"ev":"tile.changed"' \
            && echo "检测到方块变更日志"
          if docker logs panel-doc | grep '"ev":"syncplayer.echoed"' | grep -qv '"alsoSent":"none"'; then
            echo "id:4 回显时还发了别的东西"; docker logs panel-doc | grep syncplayer.echoed; exit 1
          fi

          # R6：id:17 只回显，不能因为方块修改发送整块 id:10
          if docker logs panel-doc | grep -q '"ev":"tile.changed"' && docker logs panel-doc | grep -q '"ev":"frame.send".*"id":"10"'; then
            echo "id:17 之后不应发送 id:10（仅回显单条变更）"; exit 1
          fi
          if docker logs panel-doc | grep '"ev":"conn.error"'; then
            echo "出现 conn.error（连接级异常）"; docker logs panel-doc | grep '"ev":"conn.error"'; exit 1
          fi
          # 只认异常签名（日志里的说明文字会提到这个词，不能按裸词判）
          if docker logs panel-doc | grep -q '"type":"OverflowException"'; then
            echo "出现 OverflowException（Math.Abs 崩溃回归）"; docker logs panel-doc | grep '"type":"OverflowException"'; exit 1
          fi
          docker logs panel-doc | grep -q '"ev":"frame.handle.error"' \
            && { echo "单帧处理异常（应尽量没有）"; docker logs panel-doc | grep frame.handle.error; }

          # R8-2 动态档案：仓库就绪 + 新玩家建档 + 落盘 + 退出保存
          docker logs panel-doc | grep '"ev":"ssc.store.ready"' | head -1
          docker logs panel-doc | grep -q '"ev":"ssc.profile.created"' \
            || { echo "缺少 ssc.profile.created（新玩家没有建档）"; docker logs panel-doc | grep ssc.; exit 1; }
          docker logs panel-doc | grep '"ev":"ssc.profile.created"' | head -1
          docker logs panel-doc | grep '"ev":"ssc.profile.ready"' | head -1
          docker logs panel-doc | grep '"ev":"ssc.profile.saved"' | head -1
          [ -f "server/dist/Players/Tst.plr" ] \
            || { echo "Players/Tst.plr 没有落盘"; ls -l server/dist/Players 2>&1; exit 1; }
          echo "档案文件：" $(ls -l server/dist/Players/Tst.plr)

          # 建档内容：能被 --parse-plr 重新读出、名字是 Tst
          docker run --rm -v "$PWD/server/dist:/app" -w /app \
            mcr.microsoft.com/dotnet/runtime:8.0 \
            dotnet BunnyLoader.Server.dll --parse-plr Players/Tst.plr > plr-check.txt 2>&1 || true
          grep -o '"ev":"plr.field","name":"name","offset":[0-9]*,"len":[0-9]*,"value":"[^"]*"' plr-check.txt | head -1
          grep -q 'Tst' plr-check.txt \
            || { echo "Players/Tst.plr 解析不出名字 Tst"; tail -20 plr-check.txt; exit 1; }

          # 第 8 章验收 (5)：同一条会话里 id:4 只能发一次（收到时立即回显那一次）。
          # 只数 frame.send（frame.recv 也会打印 "name":"SyncPlayer"）。
          sync4=$(docker logs panel-doc | grep -c '"ev":"frame.send".*"name":"SyncPlayer"')
          echo "id:4 发送次数 = $sync4"
          [ "$sync4" -eq 1 ] || { echo "id:4 发了 $sync4 次，必须恰好 1 次"; docker logs panel-doc | grep '"name":"SyncPlayer"'; exit 1; }

          docker rm -f panel-doc

      - name: 严格状态机 — DISABLE_163 对照组
        run: |
          docker run -d --name panel-n163 --restart=no \
            -e PROOF_MODE=on -e DISABLE_163=true -e MSG3_VARIANT=flags1 \
            -p 17796:7777 -v "$PWD/server/dist:/app" -w /app \
            mcr.microsoft.com/dotnet/runtime:8.0 \
            dotnet BunnyLoader.Server.dll --port 7777
          for i in $(seq 1 30); do
            docker logs panel-n163 2>&1 | grep -q '"ev":"server.start"' && break; sleep 1
          done
          python3 - <<'PYC'
          import socket, sys
          sys.path.insert(0, "tools")
          from fake_client import DOC_PROOF, DOC_PROOF_REPLY, frame, string, recv_frame, recv_exact
          s = socket.create_connection(("127.0.0.1", 17796), timeout=6)
          s.settimeout(6)
          assert recv_exact(s, len(DOC_PROOF)) == DOC_PROOF
          s.sendall(DOC_PROOF_REPLY)
          s.sendall(frame(1, string("Terraria326")))
          ident, payload = recv_frame(s)
          assert ident == 3, f"期望 3，收到 {ident}"
          assert payload == b"\x01\x01", payload.hex()
          print("PASS DISABLE_163 下回执后直接回 id:3")
          PYC
          docker logs panel-n163 | grep -E 'proof\.verified|serverinfo\.163' | head -3
          docker rm -f panel-n163

      - name: 严格状态机 — 验证前发 Hello 必须断开
        run: |
          docker run -d --name panel-rej --restart=no \
            -e PROOF_MODE=on -e MSG3_VARIANT=flags1 \
            -p 17798:7777 -v "$PWD/server/dist:/app" -w /app \
            mcr.microsoft.com/dotnet/runtime:8.0 \
            dotnet BunnyLoader.Server.dll --port 7777
          for i in $(seq 1 30); do
            docker logs panel-rej 2>&1 | grep -q '"ev":"server.start"' && break; sleep 1
          done
          python3 tools/fake_client.py 127.0.0.1 17798 proofreject
          docker logs panel-rej | grep -E 'proof\.rejected' | head -2
          docker rm -f panel-rej

      - name: Proof off — 老客户端直接发帧（legacy 兼容）
        run: |
          docker run -d --name panel-auto --restart=no \
            -e PROOF_MODE=off -e MSG3_VARIANT=flags1 \
            -e WORLD_ON_HELLO=off \
            -p 17791:7777 -v "$PWD/server/dist:/app" -w /app \
            mcr.microsoft.com/dotnet/runtime:8.0 \
            dotnet BunnyLoader.Server.dll --port 7777
          for i in $(seq 1 30); do
            docker logs panel-auto 2>&1 | grep -q '"ev":"server.start"' && break; sleep 1
          done
          python3 tools/fake_client.py 127.0.0.1 17791 world
          docker logs panel-auto | grep -E 'proof\.skipped' | head -2
          docker rm -f panel-auto

      - name: Real world — 解析真实 1.4.5.8 存档
        run: |
          docker run --rm -v "$PWD/server/testdata:/td:ro" -v "$PWD/server/dist:/app" -w /app \
            mcr.microsoft.com/dotnet/runtime:8.0 \
            dotnet BunnyLoader.Server.dll --world-info /td/real-world.wld | tee /tmp/real.txt
          grep -q '"size":"4200x1200"' /tmp/real.txt
          grep -q '"spawn":"2105,312"' /tmp/real.txt
          grep -q '"version":326' /tmp/real.txt
          grep -q '块状的小屋' /tmp/real.txt

      - name: World file — 解析 .wld 并打印摘要
        run: |
          mkdir -p /tmp/wld
          python3 tools/make_test_world.py /tmp/wld/test.wld
          docker run --rm -v /tmp/wld:/wld -v "$PWD/server/dist:/app" -w /app \
            -e LOG_LEVEL=info \
            mcr.microsoft.com/dotnet/runtime:8.0 \
            dotnet BunnyLoader.Server.dll --world-info /wld/test.wld | tee /tmp/wld/info.txt
          grep -q '"size":"400x300"' /tmp/wld/info.txt
          grep -q '"name":"TestWorld"' /tmp/wld/info.txt

      - name: World file — 用 .wld 起服务并进世界
        run: |
          docker run -d --name panel-wld --restart=no -e MSG3_VARIANT=flags1 -e WORLD_ON_HELLO=off -e PROOF_MODE=off \
            -p 17789:7777 -v /tmp/wld:/wld -v "$PWD/server/dist:/app" -w /app \
            mcr.microsoft.com/dotnet/runtime:8.0 \
            dotnet BunnyLoader.Server.dll --port 7777 --world /wld/test.wld
          for i in $(seq 1 30); do
            docker logs panel-wld 2>&1 | grep -q '"ev":"server.start"' && break; sleep 1
          done
          docker logs panel-wld | head -5
          python3 tools/fake_client.py 127.0.0.1 17789 world || {
            echo "===== server log (tail 80) ====="
            docker logs panel-wld | tail -80
            exit 1
          }
          docker logs panel-wld | grep -E 'world.loaded|chunks\.|world.sections' | head -5
          docker rm -f panel-wld

      - name: World — 平坦世界分块（8 -> 7/9/10×N/49）
        run: |
          docker run -d --name panel-world --restart=no -e PROOF_MODE=off \
            -e MSG3_VARIANT=flags1 \
            -e WORLD_ON_HELLO=off \
            -p 17787:7777 -v "$PWD/server/dist:/app" -w /app \
            mcr.microsoft.com/dotnet/runtime:8.0 \
            dotnet BunnyLoader.Server.dll --port 7777
          for i in $(seq 1 30); do
            docker logs panel-world 2>&1 | grep -q '"ev":"server.start"' && break; sleep 1
          done
          docker logs panel-world || true
          python3 tools/fake_client.py 127.0.0.1 17787 world
          docker logs panel-world | tail -5
          docker rm -f panel-world

      - name: World fallback — 客户端发 (-1,-1) 时应回退到出生点
        run: |
          docker run -d --name panel-wneg --restart=no -e PROOF_MODE=off \
            -e MSG3_VARIANT=flags1 \
            -e WORLD_ON_HELLO=off \
            -p 17788:7777 -v "$PWD/server/dist:/app" -w /app \
            mcr.microsoft.com/dotnet/runtime:8.0 \
            dotnet BunnyLoader.Server.dll --port 7777
          for i in $(seq 1 30); do
            docker logs panel-wneg 2>&1 | grep -q '"ev":"server.start"' && break; sleep 1
          done
          python3 tools/fake_client.py 127.0.0.1 17788 worldneg
          docker logs panel-wneg | grep -E 'spawn.fallback|sections' | head -3
          docker rm -f panel-wneg

      - name: Bundle — 消息3 + 欢迎 + 7（同一次 write）
        run: |
          docker run -d --name panel-b7 --restart=no -e PROOF_MODE=off \
            -e SEND_MSG7_AFTER_3=true -e MSG7_INCLUDE_WELCOME=true -e MSG3_VARIANT=flags1 \
            -e WORLD_ON_HELLO=off \
            -p 17785:7777 -v "$PWD/server/dist:/app" -w /app \
            mcr.microsoft.com/dotnet/runtime:8.0 \
            dotnet BunnyLoader.Server.dll --port 7777
          for i in $(seq 1 30); do
            docker logs panel-b7 2>&1 | grep -q '"ev":"server.start"' && break; sleep 1
          done
          python3 tools/fake_client.py 127.0.0.1 17785 msg7
          docker rm -f panel-b7

      - name: Bundle — 消息3 + 7（无欢迎，用于对照）
        run: |
          docker run -d --name panel-b7o --restart=no -e PROOF_MODE=off \
            -e SEND_MSG7_AFTER_3=true -e MSG7_INCLUDE_WELCOME=false -e MSG3_VARIANT=flags1 \
            -e WORLD_ON_HELLO=off \
            -p 17786:7777 -v "$PWD/server/dist:/app" -w /app \
            mcr.microsoft.com/dotnet/runtime:8.0 \
            dotnet BunnyLoader.Server.dll --port 7777
          for i in $(seq 1 30); do
            docker logs panel-b7o 2>&1 | grep -q '"ev":"server.start"' && break; sleep 1
          done
          python3 tools/fake_client.py 127.0.0.1 17786 msg7only
          docker rm -f panel-b7o

      - name: Candidates rotation — MSG3_CANDIDATES=auto（第1次应为 16 字节补零）
        run: |
          docker run -d --name panel-cand --restart=no -e WORLD_ON_HELLO=off -e PROOF_MODE=off \
            -e MSG3_CANDIDATES=auto \
            -p 17784:7777 -v "$PWD/server/dist:/app" -w /app \
            mcr.microsoft.com/dotnet/runtime:8.0 \
            dotnet BunnyLoader.Server.dll --port 7777
          for i in $(seq 1 30); do
            docker logs panel-cand 2>&1 | grep -q '"ev":"server.start"' && break; sleep 1
          done
          docker logs panel-cand || true
          python3 tools/fake_client.py 127.0.0.1 17784 hex:00000000000000000000000000000000
          docker rm -f panel-cand

      - name: Isolation — SKIP_WELCOME_PACK=true（消息3后必须零字节）
        run: |
          docker run -d --name panel-silent --restart=no -e WORLD_ON_HELLO=off -e PROOF_MODE=off \
            -e SKIP_WELCOME_PACK=true -e MSG3_VARIANT=flags1 \
            -e WORLD_ON_HELLO=off \
            -p 17783:7777 -v "$PWD/server/dist:/app" -w /app \
            mcr.microsoft.com/dotnet/runtime:8.0 \
            dotnet BunnyLoader.Server.dll --port 7777
          for i in $(seq 1 30); do
            docker logs panel-silent 2>&1 | grep -q '"ev":"server.start"' && break; sleep 1
          done
          docker logs panel-silent || true
          python3 tools/fake_client.py 127.0.0.1 17783 silent
          docker rm -f panel-silent

      - name: Package
        run: |
          cd server/dist
          # publish 只产出编译物，配置与自检向量要单独放进去，
          # 否则文档里列出的 config/ 与 testdata/ 解压后不存在。
          cp ../start.sh start.sh
          chmod +x start.sh
          # 容器内以 root 跑过 selftest/e2e，dist 里的 Players/ 可能是 root 拥有的，先清掉
          sudo rm -rf Players debug debug2 || true
          mkdir -p config testdata Players world
          touch world/.gitkeep
          cp ../config/server.json config/
          cp ../testdata/handshake-vectors.json testdata/
          # 动态档案的**模板**：新玩家用它生成开荒档（玩家自己的档在 Players/<名字>.plr）
          cp ../../debug/Cup.plr Players/.template.plr
          rm -f player.plr
          # root 留下的 debug/ 已在上面清过；这里再兜一次
          sudo rm -rf debug debug2 || true
          rm -f *.pdb
          zip -r ../bunny-loader-server-panel.zip .
          cd ../..
          echo "--- 包内容 ---"
          unzip -l server/bunny-loader-server-panel.zip
          ls -lh server/bunny-loader-server-panel.zip
          sha256sum server/bunny-loader-server-panel.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bunny-loader-server-panel
          path: server/bunny-loader-server-panel.zip
          if-no-files-found: error

      # 面板用户没有 SSH，所以用 Release 资产交付 zip。
      - name: Publish release asset
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view panel >/dev/null 2>&1 || \
            gh release create panel \
              --title "Panel build (latest)" \
              --notes "框架依赖版：面板自带 .NET 8 即可运行。解压后 sh start.sh（或 dotnet BunnyLoader.Server.dll --port 端口）。每次推送 main 都会原地更新这一个文件。"
          gh release upload panel server/bunny-loader-server-panel.zip --clobber
          gh release view panel --json assets --jq '.assets[] | "\(.name)  \(.size) bytes"'
