name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docker:
    name: docker build + selftest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          docker --version
          python3 --version

      # 验收条件 1：Docker 构建必须通过。失败就在这里红。
      - name: Docker build
        run: docker build -t bunny-loader-server:ci ./server

      # 验收条件 5：C# 必须真的编译并跑起来。--selftest 会逐字节比对 golden vectors。
      - name: C# selftest (golden vectors)
        run: docker run --rm bunny-loader-server:ci --selftest

      - name: Python reference selftest
        run: python3 tools/proto_ref.py selftest

      # 端到端：起真实容器，用假 BL 客户端走一遍 1→3→68→200→6→7。
      - name: Start server
        run: |
          docker run -d --name bls --restart=no -p 17777:7777 \
            bunny-loader-server:ci --config config/server.json --capture captures

          ready=0
          for i in $(seq 1 30); do
            if docker logs bls 2>&1 | grep -q '"ev":"server.start"'; then
              echo "app reported server.start after ${i}s"
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "app never reported server.start"
            docker logs bls || true
            exit 1
          fi
          docker logs bls || true

      - name: Handshake end-to-end (fake BL client)
        run: python3 tools/fake_client.py 127.0.0.1 17777 flags

      - name: Server logs
        if: always()
        run: |
          docker ps -a --format 'NAME={{.Names}} STATUS={{.Status}}'
          docker logs bls || true

      - name: Stop server
        if: always()
        run: docker rm -f bls

  panel:
    name: panel package (framework-dependent)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 面板自带 .NET 8，所以做标准框架依赖发布：只有 dll + runtimeconfig，约 200 KB。
      - name: Publish (framework-dependent)
        run: |
          rm -rf server/dist && mkdir -p server/dist
          docker run --rm -v "$PWD/server:/src" -w /src mcr.microsoft.com/dotnet/sdk:8.0 \
            dotnet publish src/BunnyLoader.Server/BunnyLoader.Server.csproj \
              -c Release -o /src/dist
          ls -lh server/dist

      - name: Print effective config (--port wins over everything)
        run: |
          docker run --rm -v "$PWD/server/dist:/app" -w /app \
            mcr.microsoft.com/dotnet/runtime:8.0 \
            dotnet BunnyLoader.Server.dll --port 18080 --print-config

      # 模拟面板：runtime 镜像里没有 SDK，只有运行时；启动方式与面板一致。
      - name: Run on .NET runtime image — MSG3_SPECIAL_FLAG=true
        run: |
          docker run -d --name panel-flags --restart=no \
            -e MSG3_SPECIAL_FLAG=true \
            -p 17780:7777 \
            -v "$PWD/server/dist:/app" -w /app \
            mcr.microsoft.com/dotnet/runtime:8.0 \
            dotnet BunnyLoader.Server.dll --port 7777

          for i in $(seq 1 30); do
            if docker logs panel-flags 2>&1 | grep -q '"ev":"server.start"'; then break; fi
            sleep 1
          done
          docker logs panel-flags || true
          docker logs panel-flags 2>&1 | grep -q '"port":7777' || { echo "端口未生效"; exit 1; }
          python3 tools/fake_client.py 127.0.0.1 17780 flags
          docker rm -f panel-flags

      - name: Run on .NET runtime image — MSG3_SPECIAL_FLAG=false
        run: |
          docker run -d --name panel-slot --restart=no \
            -e MSG3_SPECIAL_FLAG=false \
            -p 17781:7777 \
            -v "$PWD/server/dist:/app" -w /app \
            mcr.microsoft.com/dotnet/runtime:8.0 \
            dotnet BunnyLoader.Server.dll --port 7777

          for i in $(seq 1 30); do
            if docker logs panel-slot 2>&1 | grep -q '"ev":"server.start"'; then break; fi
            sleep 1
          done
          docker logs panel-slot || true
          python3 tools/fake_client.py 127.0.0.1 17781 slot
          docker rm -f panel-slot

      - name: Package
        run: |
          cd server/dist
          zip -r ../bunny-loader-server-panel-r2.zip .
          cd ../..
          ls -lh server/bunny-loader-server-panel-r2.zip
          sha256sum server/bunny-loader-server-panel-r2.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bunny-loader-server-panel-r2
          path: server/bunny-loader-server-panel-r2.zip
          if-no-files-found: error

      # 面板用户没有 SSH，所以用 Release 资产交付 zip。
      - name: Publish release asset
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view panel-r2 >/dev/null 2>&1 || \
            gh release create panel-r2 \
              --title "Panel build (R2)" \
              --notes "框架依赖版：面板自带 .NET 8 即可运行。解压后 dotnet BunnyLoader.Server.dll --port 端口"
          gh release upload panel-r2 server/bunny-loader-server-panel-r2.zip --clobber
          gh release view panel-r2 --json assets --jq '.assets[] | "\(.name)  \(.size) bytes"'
