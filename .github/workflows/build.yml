name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  docker:
    name: docker build + selftest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          docker --version
          python3 --version

      # 验收条件 1：Docker 构建必须通过。失败就在这里红。
      - name: Docker build
        run: docker build -t bunny-loader-server:ci ./server

      # 验收条件 5：C# 必须真的编译并跑起来。--selftest 会逐字节比对 golden vectors。
      - name: C# selftest (golden vectors)
        run: docker run --rm bunny-loader-server:ci --selftest

      - name: Python reference selftest
        run: python3 tools/proto_ref.py selftest

      # 端到端：起真实容器，用假 BL 客户端走一遍 1→3→68→200→6→7。
      # 这一步验证的是会话逻辑与真实 socket 上的字节，不只是编解码。
      - name: Start server
        run: |
          docker run -d --name bls --restart=no -p 17777:7777 \
            bunny-loader-server:ci --config config/server.json --capture captures
          docker inspect -f 'state={{.State.Status}} exit={{.State.ExitCode}}' bls || true

          # 就绪判定必须是确定性的：等应用自己打印 server.start，
          # 而不是等端口能连——端口由 docker-proxy 提前占住，会产生竞态。
          ready=0
          for i in $(seq 1 30); do
            if docker logs bls 2>&1 | grep -q '"ev":"server.start"'; then
              echo "app reported server.start after ${i}s"
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "app never reported server.start"
            docker logs bls || true
            exit 1
          fi

          sleep 1
          echo "--- after readiness ---"
          docker inspect -f 'state={{.State.Status}} exit={{.State.ExitCode}}' bls || true
          docker logs bls || true
          echo "--- listeners inside the container (hex port 1E61 = 7777) ---"
          docker exec bls sh -c 'cat /proc/net/tcp | head -20' || true
          echo "--- host listeners ---"
          (ss -lntp 2>/dev/null || netstat -lntp 2>/dev/null) | grep -E '17777|7777' || true

      - name: Handshake end-to-end (fake BL client)
        run: python3 tools/fake_client.py 127.0.0.1 17777

      - name: Server logs
        if: always()
        run: |
          docker ps -a --format 'NAME={{.Names}} STATUS={{.Status}}'
          docker inspect -f 'state={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} error={{.State.Error}}' bls || true
          docker logs bls || true

      - name: Stop server
        if: always()
        run: docker rm -f bls

      - name: Show image size
        if: always()
        run: docker images bunny-loader-server:ci
